<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Revision Scheduler</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>

  <header class="header">
    <h1 id="home-label" class="clickable">Smart Revision Scheduler</h1>
    <a href="{{ url_for('help_page') }}" class="help">Help</a>
  </header>

  <main class="main">
    <h2>Plan Smarter.<br>Study Smarter</h2>
    <p class="subtitle">Generate a revision timetable that adapts to you</p>

    <div class="button-group">
      <button type="button" class="btn primary" id="start-new-timetable">Start New Timetable</button>
      <button type="button" class="btn secondary" id="load-timetable">Load Timetable</button>
    </div>

    <a href="{{ url_for('help_page') }}#how-it-works" class="how-it-works">How it Works</a>
  </main>

  <footer class="footer">
    <p id="footer-label" class="clickable">Smart Revision Scheduler</p>
  </footer>

  <script>
    document.getElementById('start-new-timetable').onclick = () => 
      window.location.href = "{{ url_for('subject_input') }}";
    
    document.getElementById('load-timetable').onclick = async () => {
      try {
        const response = await fetch('/check-timetable');
        const data = await response.json();
        
        if (data.exists && data.has_sessions) {
          window.location.href = "{{ url_for('timetable_dashboard') }}";
        } else {
          alert('No timetable found');
        }
      } catch (error) {
        alert('Error loading timetable');
      }
    };
    
    document.getElementById('home-label').onclick = () => 
      window.location.href = "{{ url_for('home') }}";
    
    document.getElementById('footer-label').onclick = () => 
      window.location.href = "{{ url_for('home') }}";
  </script>

</body>
</html>
